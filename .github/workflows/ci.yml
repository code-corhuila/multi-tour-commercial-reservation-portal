name: CI
on:
  pull_request:
    branches: [develop, qa]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      # What the container mounts (ADR-006 F4): dist/portal.js and dist/portal.css. Amendment 2026-10-13, HC-6.
      # The demo module is what the delivered image serves until the API is connected; it must build too.
      - run: npm run build:module:demo
      - run: npm run build:module
      - name: Check the size budget of the mounted module
        run: node scripts/check-bundle-size.mjs
      - name: Record the size of the mounted module
        run: |
          {
            echo '### Mounted module'
            echo '| File | Bytes | KB |'
            echo '|---|---:|---:|'
            for f in dist/portal.js dist/portal.css; do
              b=$(stat -c %s "$f")
              echo "| \`$f\` | $b | $(awk -v b="$b" 'BEGIN { printf "%.1f", b / 1024 }') |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

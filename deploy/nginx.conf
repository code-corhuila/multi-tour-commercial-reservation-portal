server {
    listen 80;
    root /usr/share/nginx/html;

    # remoteEntry and the federation manifest must never be cached: they decide
    # which version of every portal the browser loads.
    location ~* (remoteEntry\.js|remoteEntry\.json|federation\.manifest\.json)$ {
        add_header Cache-Control "no-store";
        add_header Access-Control-Allow-Origin "*";
    }
    location / {
        add_header Access-Control-Allow-Origin "*";
        try_files $uri $uri/ /index.html;
    }
}
